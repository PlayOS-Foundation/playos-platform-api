name: API Docs and Examples

on:
  push:
    branches: [main]
    paths:
      - 'include/**'
      - 'examples/**'
      - 'Doxyfile'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]

jobs:
  docs:
    name: Doxygen + examples
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install doxygen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq doxygen

      - name: Build Doxygen docs (warnings are errors)
        run: |
          doxygen Doxyfile

      - name: Compile examples against public headers
        run: |
          make -C examples check
